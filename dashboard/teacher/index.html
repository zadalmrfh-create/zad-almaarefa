<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم | زاد المعرفة</title><link rel="stylesheet" href="../dashboard.css"></head><body><div class="wrap"><header class="top"><div class="brand"><h1>زاد المعرفة</h1><small>لوحة المعلم</small></div><div class="actions"><a class="btn" href="../../index.html">الرئيسية</a><button id="logout" class="btn danger">تسجيل الخروج</button></div></header><main><div id="loading" class="notice">جارٍ التحقق...</div><section class="hero"><h2>مرحبًا <span data-name>...</span> 👨‍🏫</h2><p data-email></p></section><section class="card"><h3>👥 بيانات الطلاب</h3><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الإيميل</th><th>رقم الهاتف</th><th>الصف الدراسي</th><th>واتساب</th></tr></thead><tbody id="students"><tr><td colspan="5">جارٍ التحميل...</td></tr></tbody></table></div></section></main></div><script type="module">import {auth,db} from '../../firebase-config.js';import {onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import {doc,getDoc,collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';function whatsappNumber(value){ const digits=String(value||'').replace(/\D/g,''); return digits.startsWith('0') ? '20'+digits.slice(1) : digits; }
onAuthStateChanged(auth,async u=>{if(!u)return location.replace('../../login/index.html');const me=await getDoc(doc(db,'users',u.uid));const p=me.exists()?me.data():{};if(p.role!=='teacher'||p.status!=='active')return location.replace('../../student/dashboard.html');document.querySelector('[data-name]').textContent=p.fullName||p.name||u.email;document.querySelector('[data-email]').textContent=u.email;const snap=await getDocs(collection(db,'users'));const rows=[];snap.forEach(d=>{const x=d.data();if(x.role==='student')rows.push(`<tr><td>${x.fullName||x.name||'-'}</td><td>${x.email||'-'}</td><td>${x.phone||x.phoneNumber||'-'}</td><td>${x.grade||x.studyGrade||'-'}</td><td>${x.phone||x.phoneNumber?`<a class="btn gold" target="_blank" href="https://wa.me/${whatsappNumber(x.phone||x.phoneNumber)}">واتساب</a>`:'-'}</td></tr>`)});document.getElementById('students').innerHTML=rows.join('')||'<tr><td colspan="5">لا يوجد طلاب.</td></tr>';document.getElementById('loading').remove()});document.getElementById('logout').onclick=()=>signOut(auth).then(()=>location.replace('../../login/index.html'));</script></body></html>
