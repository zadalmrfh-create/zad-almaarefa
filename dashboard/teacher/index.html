<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم | زاد المعرفة</title><link rel="icon" href="../../images/logo.png.png"><link rel="stylesheet" href="../dashboard.css"></head><body><div class="wrap"><header class="top"><div class="brand"><img src="../../images/logo.png.png"><div><h1>زاد المعرفة</h1><small>لوحة المعلم</small></div></div><div class="actions"><a class="btn" href="../../index.html">الرئيسية</a><button id="logout" class="btn danger">تسجيل الخروج</button></div></header><main><div id="loading" class="notice">جارٍ التحقق من الحساب…</div><section class="hero"><h2>مرحبًا <span data-name>...</span> 👨‍🏫</h2><p data-email></p></section><div id="pending" class="notice" style="display:none">حسابك كمعلم في انتظار اعتماد الإدارة. ستظهر أدوات المعلم بعد الاعتماد.</div><section id="teacherTools" class="grid" style="display:none"><div class="card"><h3>🎥 دروسي</h3><p>مكان تجهيز إدارة الدروس ورفع المحتوى.</p></div><div class="card"><h3>🗓️ المواعيد</h3><p>مكان إدارة أوقات الحجز المتاحة.</p></div><div class="card"><h3>👥 الطلاب</h3><p>مكان متابعة الطلاب والحجوزات.</p></div></section></main></div><script type="module">import {guard} from '../dashboard.js';import {auth} from '../../firebase-config.js';import {signOut} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';guard('teacher',({profile})=>{if(profile.status==='pending')document.getElementById('pending').style.display='block';else document.getElementById('teacherTools').style.display='grid'});document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='../../index.html'};</script></body></html>
