<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم | زاد المعرفة</title><link rel="stylesheet" href="../dashboard.css">
<link rel="stylesheet" href="../../assets/translation.css">
<script src="../../assets/translation.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="../../content-protection.js" defer></script>
</head><body><div class="wrap"><header class="top"><div class="brand"><h1>زاد المعرفة</h1><small>لوحة المعلم</small></div><div class="actions"><a class="btn" href="../../index.html">الرئيسية</a><button id="logout" class="btn danger">تسجيل الخروج</button></div></header><main><div id="loading" class="notice">جارٍ التحقق...</div><section class="hero"><h2>مرحبًا <span data-name>...</span> 👨‍🏫</h2><p data-email></p></section><section class="card" id="teacherBookings"><h3>📅 طلبات حجز الحصص</h3><div class="table-wrap"><table class="table"><thead><tr><th>الطالب</th><th>المادة</th><th>الصف</th><th>اليومان</th><th>النوع</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="teacherBookingRows"><tr><td colspan="7">جارٍ التحميل...</td></tr></tbody></table></div></section><section class="card"><h3>👥 بيانات الطلاب</h3><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الإيميل</th><th>رقم الهاتف</th><th>الصف الدراسي</th><th>واتساب</th></tr></thead><tbody id="students"><tr><td colspan="5">جارٍ التحميل...</td></tr></tbody></table></div></section></main></div><script type="module">import {auth,db} from '../../firebase-config.js';import {onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import {doc,getDoc,collection,getDocs,query,where,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';function whatsappNumber(value){ const digits=String(value||'').replace(/\D/g,''); return digits.startsWith('0') ? '20'+digits.slice(1) : digits; }
onAuthStateChanged(auth,async u=>{if(!u)return location.replace('../../login/index.html');const me=await getDoc(doc(db,'users',u.uid));const p=me.exists()?me.data():{};if(p.role!=='teacher'||p.status!=='active')return location.replace('../../dashboard/student/index.html');document.querySelector('[data-name]').textContent=p.fullName||p.name||u.email;document.querySelector('[data-email]').textContent=u.email;const snap=await getDocs(query(collection(db,'users'),where('role','==','student')));const rows=[];snap.forEach(d=>{const x=d.data();if(x.role==='student')rows.push(`<tr><td>${x.fullName||x.name||'-'}</td><td>${x.email||'-'}</td><td>${x.phone||x.phoneNumber||'-'}</td><td>${x.grade||x.studyGrade||'-'}</td><td>${x.phone||x.phoneNumber?`<a class="btn gold" target="_blank" href="https://wa.me/${whatsappNumber(x.phone||x.phoneNumber)}">واتساب</a>`:'-'}</td></tr>`)});document.getElementById('students').innerHTML=rows.join('')||'<tr><td colspan="5">لا يوجد طلاب.</td></tr>';await loadTeacherBookings(u.uid);document.getElementById('loading').remove()});document.getElementById('logout').onclick=()=>signOut(auth).then(()=>location.replace('../../login/index.html'));
async function loadTeacherBookings(uid){
 const body=document.getElementById('teacherBookingRows');
 try{const snap=await getDocs(query(collection(db,'bookings'),where('teacherUid','==',uid)));body.innerHTML='';snap.forEach(x=>{const b=x.data();const tr=document.createElement('tr');tr.innerHTML=`<td>${b.fullName||'-'}<br>${b.phone||'-'}</td><td>${b.subject||'-'}</td><td>${b.educationType||''} / ${b.grade||'-'}</td><td>${b.preferredDay1||'-'} — ${b.preferredDay2||'-'}<br>${b.preferredPeriod||''}</td><td>${b.lessonType||'-'}<br>${b.lessonMode||''}</td><td><select class="booking-status-select"><option ${b.status==='جديد'?'selected':''}>جديد</option><option ${b.status==='قيد المراجعة'?'selected':''}>قيد المراجعة</option><option ${b.status==='تم التواصل'?'selected':''}>تم التواصل</option><option ${b.status==='تم الحجز'?'selected':''}>تم الحجز</option><option ${b.status==='مكتمل'?'selected':''}>مكتمل</option><option ${b.status==='ملغي'?'selected':''}>ملغي</option></select></td><td><button class="btn" data-id="${x.id}">حفظ</button></td>`;body.appendChild(tr);});if(!body.innerHTML)body.innerHTML='<tr><td colspan="7">لا توجد طلبات معيّنة لك.</td></tr>';body.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=async()=>{const tr=btn.closest('tr');await updateDoc(doc(db,'bookings',btn.dataset.id),{status:tr.querySelector('select').value,updatedAt:serverTimestamp()});btn.textContent='تم الحفظ';});}catch(e){body.innerHTML='<tr><td colspan="7">تعذر تحميل الطلبات: '+(e.code||e.message)+'</td></tr>';}
}
</script></body></html>
