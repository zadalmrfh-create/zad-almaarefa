name: Validate and publish Zad

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish public/ after reviewing Firebase rules and the update guide
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Test, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # These local tests and the static build use Node built-ins only.
      # The API server dependencies are not needed to publish GitHub Pages.
      - name: Validate canonical sources and generated output
        run: npm run release:check
      - name: Upload generated website
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publish checked output
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated public directory
        id: deployment
        uses: actions/deploy-pages@v4
