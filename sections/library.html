  />

  <style>

    * {
      font-family: "Noto Kufi Arabic", sans-serif;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #0f172a;
    }

    /* ==============================
       APP
    ============================== */

    #app {
      min-height: 100vh;
      transition: background-color 0.3s ease;
    }

    /* ==============================
       HEADER
    ============================== */

    .hero {
      background:
        radial-gradient(
          circle at top,
          rgba(240, 192, 64, 0.12),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #1e293b 0%,
          #0f172a 100%
        );
    }

    .hero-icon {
      animation: floatBook 3s ease-in-out infinite;
    }

    @keyframes floatBook {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }

    /* ==============================
       STAGE BUTTONS
    ============================== */

    .stage-btn,
    .grade-btn,
    .filter-btn,
    .sort-badge {
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }

    .stage-btn:hover,
    .grade-btn:hover,
    .filter-btn:hover,
    .sort-badge:hover {
      transform: translateY(-2px);
    }

    .stage-btn.active,
    .grade-btn.active,
    .filter-btn.active,
    .sort-badge.active {
      transform: scale(1.04);
    }

    /* ==============================
       SEARCH
    ============================== */

    .search-wrapper {
      position: relative;
    }

    .search-box {
      transition: all 0.3s ease;
      outline: none;
    }

    .search-box:focus {
      box-shadow:
        0 0 0 3px rgba(240, 192, 64, 0.18),
        0 10px 30px rgba(0, 0, 0, 0.12);
    }

    /* ==============================
       BOOK CARD
    ============================== */

    .book-card {
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background-color 0.3s ease;

      animation: fadeUp 0.5s ease forwards;

      opacity: 0;
    }

    .book-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .download-btn {
      transition: all 0.25s ease;
    }

    .download-btn:hover {
      transform: scale(1.03);
    }

    /* ==============================
       BACK BUTTON
    ============================== */

    .back-btn {
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      transform: translateX(4px);
    }

    /* ==============================
       EMPTY
    ============================== */

    .empty-box {
      border: 1px dashed rgba(148, 163, 184, 0.25);
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 640px) {

      .hero h1 {
        font-size: 1.6rem;
      }

      .hero p {
        font-size: 0.85rem;
      }

      .book-card {
        padding: 1rem;
      }

    }

  </style>
</head>

function selectStage(stage) {

  renderGrades();

  currentGrade = null;

  document

    .style.display = "none";

}

========================================================= */

function updateStageButtons() {

  document
    .querySelectorAll(".stage-btn")
    .forEach((btn) => {

      const active =
        btn.dataset.stage === currentStage;

      btn.classList.toggle(
        "active",
        active
      );

      btn.style.backgroundColor =
        active
          ? "#f0c040"
          : isDarkMode
            ? "#1e293b"
            : "#e2e8f0";

      btn.style.color =

          ? "#0f172a"
          : isDarkMode
            ? "#94a3b8"
            : "#64748b";

    });

}

  label.textContent =

========================================================= */

document
  .getElementById("search-input")
  .addEventListener(
    "input",
    function () {

      applySort();

    }
  );


/* =========================================================
   GET FILTERED BOOKS
========================================================= */

function getFilteredBooks() {

  let filtered =
    books.filter(
      (book) =>
        book.grade === currentGrade
    );


  if (currentFilter !== "all") {

    filtered =
      filtered.filter(
        (book) =>
          book.cat === currentFilter
      );

  }


  const searchTerm =
    document
      .getElementById("search-input")
      .value
      .trim()
      .toLowerCase();


  if (searchTerm) {

    filtered =
      filtered.filter(
        (book) =>

          book.title
            .toLowerCase()
            .includes(searchTerm)

          ||

          book.desc
            .toLowerCase()
            .includes(searchTerm)

          ||

          book.cat
            .toLowerCase()
            .includes(searchTerm)

      );

  }


  return filtered;

}


/* =========================================================
   SORT
========================================================= */

function sortBooks(type) {

  currentSort = type;

  updateSortButtons();

  applySort();

}


function updateSortButtons() {

  document
    .querySelectorAll(".sort-badge")
    .forEach((btn) => {

      const active =
        btn.dataset.sort === currentSort;

      btn.classList.toggle(
        "active",
        active
      );

      btn.style.backgroundColor =
        active
          ? "#f0c040"
          : isDarkMode
            ? "#1e293b"
            : "#e2e8f0";

      btn.style.color =
        active
          ? "#0f172a"
          : isDarkMode
            ? "#94a3b8"
            : "#64748b";

    });

}


/* =========================================================
   APPLY SORT
========================================================= */

function applySort() {

  let filtered =
    getFilteredBooks();


  if (currentSort === "name") {

    filtered.sort(
      (a, b) =>
        a.title.localeCompare(
          b.title,
          "ar"
        )
    );

  }

  else if (currentSort === "newest") {

    filtered.sort(
      (a, b) =>
        b.date - a.date
    );

  }

  else {

    filtered.sort(
      (a, b) =>
        b.popular - a.popular
    );

  }


  renderBooks(filtered);

}


/* =========================================================
   FILTER
========================================================= */

function filterBooks(cat) {

  currentFilter = cat;

  updateFilterButtons();

  applySort();

}


function updateFilterButtons() {

  document
    .querySelectorAll(".filter-btn")
    .forEach((btn) => {

      const active =
        btn.dataset.filter ===

          : isDarkMode
            ? "#94a3b8"
            : "#64748b";

    });

}

          color:${textColor};
        "
      >

        <div class="text-5xl mb-4">
          📚
        </div>

        <div class="text-lg font-bold mb-2">
          لا توجد كتب حاليًا
        </div>

        <div class="text-sm">
          ${
            document
              .getElementById("search-input")
              .value
              ? "لا توجد كتب تطابق البحث"
              : "سيتم إضافة الكتب لهذا الصف قريبًا"
          }
        </div>

      </div>

    `;

    return;

  }


  /* BOOK CARDS */

  filtered.forEach(
    (book, index) => {

      const card =
        document.createElement("div");


      card.className =
        "book-card rounded-2xl p-5 flex flex-col";


      card.style.cssText = `

        background-color:${bgColor};

        animation-delay:${index * 0.06}s;

      `;


      card.innerHTML = `

        <!-- ICON -->

        <div
          class="text-5xl mb-4"
        >
          ${book.icon}
        </div>


        <!-- TITLE -->

        <h3
          class="text-lg font-bold mb-2"
          style="color:${titleColor}"
        >
          ${book.title}
        </h3>


        <!-- CATEGORY -->

        <span
          class="inline-block text-xs px-3 py-1 rounded-full mb-3 w-fit font-semibold"
          style="
            background-color:${tagBg};
            color:${textColor};
          "
        >
          ${book.cat}
        </span>


        <!-- DESCRIPTION -->

        <p
          class="text-sm mb-5 flex-1 leading-7"
          style="color:${textColor}"
        >
          ${book.desc}
        </p>


        <!-- DOWNLOAD -->

        <a
          href="${book.url}"
          target="_blank"
          rel="noopener noreferrer"
          class="download-btn w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-bold"
          style="
            background-color:${titleColor};
            color:${isDarkMode ? "#0f172a" : "#ffffff"};
            text-decoration:none;
          "
        >

          <i
            data-lucide="download"
            style="
              width:18px;
              height:18px;
            "
          ></i>

          تحميل الكتاب

        </a>

      `;


      grid.appendChild(card);

    }
  );


  if (window.lucide) {

    lucide.createIcons();

  }

}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

  isDarkMode =
    !isDarkMode;


  const app =
    document.getElementById(
      "app"
    );


  const themeBtn =
    document.getElementById(
      "theme-toggle"
    );


  if (isDarkMode) {

    app.style.backgroundColor =
      "#0f172a";

    themeBtn.textContent =
      "🌙 وضع داكن";

    themeBtn.style.backgroundColor =
      "#1e293b";

    themeBtn.style.color =
      "#f0c040";

  }

  else {

    app.style.backgroundColor =
      "#f8fafc";

    themeBtn.textContent =
      "☀️ وضع فاتح";

    themeBtn.style.backgroundColor =
      "#ffffff";

    themeBtn.style.color =
      "#d97706";

  }


  updateStageButtons();

  updateGradeColors();

  updateFilterButtons();

  updateSortButtons();

  updateSearchStyles();

  applySort();

}


/* =========================================================
   UPDATE GRADE COLORS
========================================================= */

function updateGradeColors() {

  document
    .querySelectorAll(".grade-btn")
    .forEach((btn) => {

      btn.style.backgroundColor =
        isDarkMode
          ? "#1e293b"
          : "#ffffff";

      btn.style.color =
        isDarkMode
          ? "#f0c040"
          : "#d97706";

      btn.style.border =
        "1px solid " +
        (
          isDarkMode
            ? "#334155"
            : "#e2e8f0"
        );

    });

}


/* =========================================================
   SEARCH STYLE
========================================================= */

function updateSearchStyles() {

  const input =
    document.getElementById(
      "search-input"
    );


  input.style.backgroundColor =
    isDarkMode
      ? "#1e293b"
      : "#ffffff";


  input.style.color =
    isDarkMode
      ? "#f0c040"
      : "#d97706";

}


/* =========================================================
   CONFIG
========================================================= */

const defaultConfig = {

  library_title:
    "المكتبة التعليمية",

  subtitle:
    "جميع الكتب والمذكرات التعليمية في مكان واحد 🚀",

  search_placeholder:
    "ابحث عن الكتاب...",

  empty_message:
    "لا توجد كتب تطابق البحث",

  background_color:
    "#0f172a",

  surface_color:
    "#1e293b",

  text_color:
    "#94a3b8",

  accent_color:
    "#f0c040",

  font_family:
    "Noto Kufi Arabic",

  font_size:
    16

};


/* =========================================================
   APPLY CONFIG
========================================================= */

function applyConfig(config) {

  const font =
    config.font_family ||
    defaultConfig.font_family;


  const fs =
    config.font_size ||
    defaultConfig.font_size;


  const title =
    document.getElementById(
      "main-title"
    );


  const subtitle =
    document.getElementById(
      "main-subtitle"
    );


  const search =
    document.getElementById(
      "search-input"
    );


  title.textContent =
    config.library_title ||
    defaultConfig.library_title;


  title.style.fontFamily =
    `${font}, sans-serif`;


  title.style.fontSize =
    `${fs * 2}px`;


  subtitle.textContent =
    config.subtitle ||
    defaultConfig.subtitle;


  subtitle.style.fontFamily =
    `${font}, sans-serif`;


  subtitle.style.fontSize =
    `${fs}px`;


  search.placeholder =
    config.search_placeholder ||
    defaultConfig.search_placeholder;

}


/* =========================================================
   ELEMENT SDK
========================================================= */

if (window.elementSdk) {

  window.elementSdk.init({

    defaultConfig,

    onConfigChange:
      async (config) => {

        applyConfig(config);

      },


    mapToCapabilities:
      (config) => ({

        recolorables: [

          {

            get: () =>
              config.background_color ||
              defaultConfig.background_color,

            set: (v) => {

              config.background_color =
                v;

              window.elementSdk.setConfig({
                background_color: v
              });

            }

          },

          {

            get: () =>
              config.surface_color ||
              defaultConfig.surface_color,

            set: (v) => {

              config.surface_color =
                v;

              window.elementSdk.setConfig({
                surface_color: v
              });

            }

          },

          {

            get: () =>
              config.text_color ||
              defaultConfig.text_color,

            set: (v) => {

              config.text_color =
                v;

              window.elementSdk.setConfig({
                text_color: v
              });

            }

          },

          {

            get: () =>
              config.accent_color ||
              defaultConfig.accent_color,

            set: (v) => {

              config.accent_color =
                v;

              window.elementSdk.setConfig({
                accent_color: v
              });

            }

          }

        ],

        borderables: [],

        fontEditable: {

          get: () =>
            config.font_family ||
            defaultConfig.font_family,

          set: (v) => {

            config.font_family =
              v;

            window.elementSdk.setConfig({
              font_family: v
            });

          }

        },

        fontSizeable: {

          get: () =>
            config.font_size ||
            defaultConfig.font_size,

          set: (v) => {

            config.font_size =
              v;

            window.elementSdk.setConfig({
              font_size: v
            });

          }

        }

      }),


    mapToEditPanelValues:
      (config) =>

        new Map([

          [
            "library_title",
            config.library_title ||
            defaultConfig.library_title
          ],

          [
            "subtitle",
            config.subtitle ||
            defaultConfig.subtitle
          ],

          [
            "search_placeholder",
            config.search_placeholder ||
            defaultConfig.search_placeholder
          ],

          [
            "empty_message",
            config.empty_message ||
            defaultConfig.empty_message
          ]

        ])

  });

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    renderGrades();

    document
      .getElementById("library-section")
      .style.display = "none";

    updateStageButtons();

    updateFilterButtons();

    updateSortButtons();

    updateSearchStyles();

    if (window.lucide) {
      lucide.createIcons();
    }

  }
);

</script>

</body>
</html>
