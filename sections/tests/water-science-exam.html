<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان العلوم المتكاملة | زاد المعرفة</title><style>body{font-family:Tahoma,Arial;background:#eef3f8;color:#172b4d;margin:0}header{background:#102c50;color:white;padding:25px;text-align:center}main{max-width:900px;margin:25px auto;padding:0 15px}.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #0012}.question{border-bottom:1px solid #ddd;padding:16px 0}.question:last-child{border:0}label{display:block;margin:9px 0;cursor:pointer}input[type=text],textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c5d1df;border-radius:9px;font:inherit}textarea{min-height:95px}button{border:0;border-radius:9px;padding:12px 20px;background:#0869bd;color:white;font:inherit;cursor:pointer;margin:6px}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#667}.good{color:green}.bad{color:#b00}.hidden{display:none}#timer{position:sticky;top:0;background:#fef3c7;padding:10px;text-align:center;font-weight:bold;z-index:2}.admin-answer{background:#f4f8ff;padding:10px;margin:7px 0;border-radius:8px}small{color:#666}@media print{header button,button,#timer,#login,#exam,#adminTools{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #aaa}#printArea{display:block!important}}</style></head><body><header><a href="code-exams.html" style="color:#fff;float:right">← كل الامتحانات</a><h1>منصة زاد المعرفة التعليمية</h1><h2>نموذج امتحان (2) — علوم متكاملة أزهر</h2><p>درس: الماء وخصائصه الكيميائية | الدرجة: 20 | الزمن: 30 دقيقة</p></header><div id="timer" class="hidden">الوقت المتبقي: <span id="clock">30:00</span></div><main><section class="card" id="login"><h3>بيانات الطالب</h3><p id="authStatus">جارٍ فحص تسجيل الدخول...</p><input id="studentName" type="text" placeholder="اسم الطالب ثلاثيًا" maxlength="100"><button id="start" disabled>ابدأ الامتحان</button><p class="muted">يجب تسجيل الدخول بحسابك على المنصة قبل بدء الامتحان.</p></section><section id="exam" class="hidden"><form id="examForm"><div id="questions"></div><button type="submit" id="submitBtn">تسليم الامتحان</button></form></section><section class="card hidden" id="result"></section><section class="card hidden" id="adminTools"><h2>لوحة تصحيح الإدارة</h2><button id="loadSubmissions">عرض إجابات الطلاب</button><div id="submissions"></div></section><section id="printArea" class="hidden"></section></main><script type="module">
// ضع إعدادات Firebase Web App الخاصة بمشروعك هنا، وليس مفتاح Service Account.

import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,serverTimestamp,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
import {auth,db,ADMIN_EMAIL} from '../../firebase-config.js';
const isAdmin=u=>Boolean(u && u.email && u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase());
const $=id=>document.getElementById(id);
const mcq=[
['عدد الروابط التساهمية التي تكونها ذرة الأكسجين في جزيء الماء:',['رابطة واحدة','رابطتان','ثلاث روابط','أربع روابط'],1],
['الذرة الأكثر قدرة على جذب إلكترونات الرابطة في جزيء الماء هي:',['الهيدروجين','الأكسجين','كلاهما بالتساوي','لا توجد ذرة منهما'],1],
['يرجع ظهور الشحنة الموجبة الجزئية على ذرتي الهيدروجين إلى:',['انتقال الإلكترونات إلى الهيدروجين','جذب الأكسجين لإلكترونات الرابطة نحوه','فقد ذرات الأكسجين للبروتونات','تكون روابط أيونية'],1],
['الرابطة الهيدروجينية تعتبر رابطة:',['داخل الجزيء فقط','بين الجزيئات','فلزية','تساهمية أحادية'],1],
['أي مما يلي يمثل الصيغة الكيميائية للماء؟',['HO','H₂O','H₂O₂','OH'],1],
['عند تكوين جزيء الماء تشارك كل ذرة هيدروجين مع الأكسجين بعدد ........ من الإلكترونات:',['إلكترون واحد','إلكترونين','ثلاثة إلكترونات','أربعة إلكترونات'],0],
['الخاصية المسؤولة عن قدرة الماء على إذابة كثير من المواد الأيونية هي:',['عدم قطبيته','قطبيته','ارتفاع كتلته الجزيئية','انخفاض درجة غليانه'],1],
['عند الضغط الجوي المعتاد يتحول الماء من الحالة السائلة إلى الغازية عند:',['0°C','25°C','100°C','104.5°C'],2],
['إذا كانت الكتلة المولية للماء 18 جم/مول، فإن كتلة الأكسجين في مول واحد من الماء تساوي:',['1 جم','2 جم','16 جم','18 جم'],2],
['أي العبارات التالية صحيحة عن الروابط الهيدروجينية في الماء؟',['أقوى من الروابط التساهمية','تربط بين جزيئات الماء','تربط الأكسجين بالهيدروجين داخل الجزيء','لا تؤثر في خواص الماء'],1]
];
const fill=[
'يحتوي جزيء الماء على ........ ذرتين من الهيدروجين وذرة ........ .',
'تنشأ القطبية في جزيء الماء بسبب اختلاف ........ بين الأكسجين والهيدروجين.',
'الشحنة التي تظهر على ذرة الأكسجين في جزيء الماء هي شحنة ........ جزئية.',
'ترتبط جزيئات الماء معًا عن طريق روابط ........ .'];
const essay=[
'علل: ذرة الأكسجين في جزيء الماء تحمل شحنة سالبة جزئية.',
'علل: جزيء الماء له شكل زاوي وليس خطيًا.',
'علل: يحتاج الماء إلى طاقة كبيرة للغليان مقارنة بكبريتيد الهيدروجين.',
'علل: يستطيع الماء إذابة كثير من المركبات الأيونية.',
'احسب النسبة المئوية الكتلية للأكسجين في جزيء الماء، علمًا بأن H = 1 و O = 16.',
'احسب كتلة الأكسجين اللازمة للتفاعل مع 6 جم من الهيدروجين لتكوين الماء، علمًا بأن النسبة الكتلية للهيدروجين إلى الأكسجين هي 1 : 8.'];
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\u064b-\u065f\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[\s\u200f\u200e.,،؛:!؟]/g,'').trim();
const accepted=[['يتكون من','يتكون','يتركب من','يتركب'],['السالبية الكهربية','السالبيه الكهربيه','الكهروسالبية','الكهروسالبيه'],['سالبة','سالب'],['هيدروجينية','هيدروجينيه']];
const answersOfFill=a=>{const x=a.map(norm);return [(x[0].includes(norm('يتكون'))||x[0].includes(norm('يتركب')))&&x[0].includes(norm('اكسجين')),accepted[1].some(v=>x[1]===norm(v)),accepted[2].some(v=>x[2]===norm(v)),accepted[3].some(v=>x[3]===norm(v))]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,started=false,submitted=false,interval=null,deadline=0;
function render(){let html='<div class="card"><h2>السؤال الأول: اختر الإجابة الصحيحة (10 درجات)</h2>';
mcq.forEach((q,i)=>{html+=`<div class="question"><b>${i+1}- ${esc(q[0])}</b>`;q[1].forEach((v,j)=>html+=`<label><input type="radio" name="mcq${i}" value="${j}" required> ${'أبجد'[j]}) ${esc(v)}</label>`);html+='</div>'});html+='</div><div class="card"><h2>السؤال الثاني: أكمل (4 درجات)</h2>';
fill.forEach((q,i)=>html+=`<div class="question"><label>${i+1}- ${esc(q)}</label><input type="text" name="fill${i}" required maxlength="250" placeholder="اكتب إجابتك"></div>`);html+='</div><div class="card"><h2>السؤال الثالث: علل (4 درجات)</h2>';
essay.slice(0,4).forEach((q,i)=>html+=`<div class="question"><label>${i+1}- ${esc(q)}</label><textarea name="essay${i}" required maxlength="2500"></textarea></div>`);html+='</div><div class="card"><h2>السؤال الرابع: مسائل وتطبيقات (درجتان)</h2>';
essay.slice(4).forEach((q,i)=>html+=`<div class="question"><label>${i+1}- ${esc(q)}</label><textarea name="essay${i+4}" required maxlength="2500"></textarea></div>`);html+='</div>';$('questions').innerHTML=html}
render();
onAuthStateChanged(auth,u=>{user=u;$('authStatus').textContent=u?'تم تسجيل الدخول. يمكنك بدء الامتحان.':'غير مسجل الدخول: افتح الامتحان بعد تسجيل الدخول من موقع زاد المعرفة.';$('start').disabled=!u;if(u&&isAdmin(u))$('adminTools').classList.remove('hidden')});
$('start').onclick=()=>{if(!user)return alert('سجل الدخول أولًا');if($('studentName').value.trim().length<3)return alert('اكتب اسم الطالب');if(started)return;started=true;$('login').classList.add('hidden');$('exam').classList.remove('hidden');$('timer').classList.remove('hidden');deadline=Date.now()+30*60*1000;interval=setInterval(()=>{const sec=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(!sec){clearInterval(interval);submitExam(true)}},1000)};
$('examForm').addEventListener('submit',e=>{e.preventDefault();submitExam(false)});
async function submitExam(expired){if(submitted)return;if(!expired&&!$('examForm').reportValidity())return;submitted=true;$('submitBtn').disabled=true;clearInterval(interval);const fd=new FormData($('examForm'));const mcqAnswers=mcq.map((_,i)=>fd.has('mcq'+i)?Number(fd.get('mcq'+i)):null),fillAnswers=fill.map((_,i)=>String(fd.get('fill'+i)||'')),essayAnswers=essay.map((_,i)=>String(fd.get('essay'+i)||''));const mcqScore=mcqAnswers.reduce((n,a,i)=>n+(a===mcq[i][2]?1:0),0),fillChecks=answersOfFill(fillAnswers),fillScore=fillChecks.filter(Boolean).length;
const payload={examId:'integrated-science-azhar-water-model-2',studentUid:user.uid,studentName:$('studentName').value.trim(),studentEmail:user.email||'',mcqAnswers,fillAnswers,essayAnswers,mcqScore,fillScore,autoScore:mcqScore+fillScore,essayScores:[null,null,null,null,null,null],finalScore:null,status:'pending_review',submittedAt:serverTimestamp(),timeExpired:expired};
try{const ref=await addDoc(collection(db,'zad_exam_submissions'),payload);$('exam').classList.add('hidden');$('timer').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2 class="good">تم تسليم الامتحان بنجاح</h2><p>رقم التسليم: ${esc(ref.id)}</p><p>درجة الأسئلة المصححة تلقائيًا: <b>${payload.autoScore} من 14</b></p><p>الدرجة النهائية من 20 ستظهر بعد مراجعة الإدارة للأسئلة المقالية والمسائل.</p>`}catch(err){submitted=false;$('submitBtn').disabled=false;alert('فشل إرسال الإجابات. لا تغلق الصفحة، وحاول مجددًا. '+err.message)}}
$('loadSubmissions').onclick=async()=>{if(!user||!isAdmin(user))return;const target=$('submissions');target.textContent='جارٍ التحميل...';try{const snap=await getDocs(query(collection(db,'zad_exam_submissions'),orderBy('submittedAt','desc')));target.innerHTML='';if(snap.empty)target.textContent='لا توجد تسليمات';snap.forEach(s=>{const d=s.data();if(d.examId!=='integrated-science-azhar-water-model-2')return;const box=document.createElement('div');box.className='card';box.innerHTML=`<h3>${esc(d.studentName)} — ${esc(d.studentEmail)}</h3><p>الدرجة الآلية: ${d.autoScore}/14 | الحالة: ${esc(d.status)}</p><button type="button" class="review">عرض الإجابات وتصحيحها</button>`;box.querySelector('button').onclick=()=>review(s.id,d);target.append(box)})}catch(e){target.textContent='تعذر جلب الإجابات: '+e.message}};
function review(id,d){const p=$('printArea');p.classList.remove('hidden');let h=`<div class="card"><h2>تقرير إجابات الطالب — زاد المعرفة</h2><p>الاسم: ${esc(d.studentName)} | البريد: ${esc(d.studentEmail)} | رقم التسليم: ${esc(id)}</p><h3>السؤال الأول: اختر</h3>`;
mcq.forEach((q,i)=>{const a=d.mcqAnswers?.[i];h+=`<div class="admin-answer"><b>${i+1}- ${esc(q[0])}</b><p>إجابة الطالب: ${a===null||a===undefined?'لم يجب':esc(q[1][a]||'غير صالحة')} | الصحيحة: ${esc(q[1][q[2]])} | ${a===q[2]?'صحيح':'خطأ'}</p></div>`});h+='<h3>السؤال الثاني: أكمل</h3>';fill.forEach((q,i)=>h+=`<div class="admin-answer"><b>${i+1}- ${esc(q)}</b><p>إجابة الطالب: ${esc(d.fillAnswers?.[i])} | ${answersOfFill(d.fillAnswers||[])[i]?'صحيح':'راجع الإجابة'}</p></div>`);h+='<h3>المقالي والمسائل</h3>';essay.forEach((q,i)=>h+=`<div class="admin-answer"><b>${i+1}- ${esc(q)}</b><p>${esc(d.essayAnswers?.[i])}</p><label>درجة السؤال (من 1): <input type="number" class="essayGrade" min="0" max="1" step="0.5" value="${d.essayScores?.[i]??''}" style="width:90px" /></label></div>`);h+=`<p>درجة التصحيح الآلي: ${d.autoScore}/14</p><p id="finalLine">${d.finalScore===null?'لم تُعتمد الدرجة النهائية':`الدرجة النهائية: ${d.finalScore}/20`}</p><button id="saveGrade" type="button">اعتماد درجات المقالي</button><button id="printReport" type="button">طباعة التقرير</button></div>`;p.innerHTML=h;p.scrollIntoView({behavior:'smooth'});$('printReport').onclick=()=>window.print();$('saveGrade').onclick=async()=>{const inputs=[...p.querySelectorAll('.essayGrade')];if(inputs.some(x=>x.value===''||Number(x.value)<0||Number(x.value)>1))return alert('اكتب درجة كل سؤال من صفر إلى واحد');const scores=inputs.map(x=>Number(x.value)),total=d.autoScore+scores.reduce((a,b)=>a+b,0);try{await updateDoc(doc(db,'zad_exam_submissions',id),{essayScores:scores,finalScore:total,status:'graded',gradedAt:serverTimestamp(),gradedBy:user.uid});$('finalLine').textContent=`الدرجة النهائية: ${total}/20`;alert('تم اعتماد النتيجة بنجاح')}catch(e){alert('فشل حفظ الدرجات: '+e.message)}}}
</script></body></html>
