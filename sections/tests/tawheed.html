<script>
const sections = [["أولاً: خلق أفعال العباد والتوفيق والخذلان", "السؤال الأول:\n1. ما أقسام أفعال العباد؟ وما المترتب على إفراد الله تعالى بالخلق؟\n2. (أ) الأفعال الاختيارية محل خلاف بين أهل السنة وغيرهم. وضح ذلك.\n   (ب) اذكر المذاهب في علاقة الأسباب بالمسببات.\n\nالسؤال الثاني:\n(أ) صح/خطأ مع تصويب وتعليل:\n1. الأفعال الاختيارية لا دخل للإنسان فيها.\n2. من يرى أن العبد هو الذي يوجد أفعاله الاختيارية هم الجبرية.\n3. العبد لا يعلم تفاصيل أفعاله.\n4. توسط المعتزلة بين الجبرية وأهل السنة في مسألة أفعال العباد.\n(ب) بم ترد على مقولة: «إن من حجة العبد أن يقول لله تعالى: لم تعذبني والكل فعلك؟»\n\nالسؤال الثالث:\n(أ) أكمل:\n1. في مسألة أفعال العباد: الجبرية ...........، والمعتزلة ...........، وتوسط ...........\n2. عند المعتزلة لا يتصور من الله ........... ما دام أقام للناس الحجة.\n3. الهدى و........... لا ينسبان إلا لله تعالى.\n4. يلزم من قول المعتزلة شبهة ...........\n(ب) إيجاد الفعل يمر بعدة مراحل، اذكرها، مبينًا المقصود بالكسب عند أهل السنة.\n(ج) ما المقصود بالكسب عند المعتزلة، وما المترتب على هذا المعنى؟\n\nالسؤال الرابع:\n(أ) اختر:\n1. سعة الرزق وضيقه أفعال: (اختيارية - اضطرارية - كلاهما صحيح)\n2. من قال بأن الإنسان كالريشة المعلقة في الهواء تحركها الرياح كيف تشاء هم: (الجبرية - المعتزلة - أهل السنة)\n3. من قال بأن الأسباب تؤثر بقوة خلقها الله فيها: (مؤمن ناج - مبتدع - كافر)\n4. لا ينسب إلى الله الخذلان عند: (الأشاعرة - المعتزلة - الفلاسفة)\n5. الكسب عند الأشاعرة هو المرحلة........... من مراحل إيجاد الفعل. (الثانية - الثالثة - الرابعة)\n(ب) ما المقصود بالمصطلحات التالية:\n- الأفعال الاضطرارية.\n- الكسب عند أهل السنة."], ["ثانياً: الوعد والوعيد", "السؤال الأول:\n(أ) ما الوعد لغة وشرعًا؟ وما حكمه؟ وفيم تستخدم لفظة الوعد؟ مع التمثيل.\n(ب) اذكر أدلة الأشاعرة والماتريدية على أن وعد الله تعالى للمؤمنين بالجنة لا يتخلف.\n\nالسؤال الثاني:\n(أ) ما حكم الوعيد عند الأشاعرة؟ وما دليلهم؟\n(ب) استنتج الماتريدية في قولهم بامتناع تخلف الوعيد بأنه يلزم من تخلفه مفاسد. اذكرها، ثم قم بتفنيدها مبينا الصحيح في ذلك.\n\nالسؤال الثالث:\n(أ) ما الوعيد لغة وشرعًا؟ ومن القائل: «يجوز أن يُخلف الله وعده في حق من يشاء من عباده»؟\n(ب) اختر:\n1. تستخدم لفظة الوعد في: (الخير - الشر والخير - الشر)\n2. يجوز تخلف الوعيد عند: (المعتزلة - الأشاعرة - الماتريدية)\n3. القائل بوجوب تنفيذ الوعيد في كل الأفراد هم: (الماتريدية - المعتزلة - الجبرية)\n\nالسؤال الرابع:\n(أ) صح/خطأ مع تصويب وتعليل:\n1. اتفقت كلمة الأشاعرة والماتريدية في حكم الوعيد.\n2. قال الأشاعرة المؤمن غير المغفور له لا بد من إنجاز الوعيد فيه.\n3. جواز تخلف الوعيد يعني وقوعه بالنسبة لكل من توعده الله بالعقوبة.\n(ب) علل:\n1. «اللهم اغفر لجميع المؤمنين جميع ذنوبهم» هذا الدعاء لا يصح على قول الماتريدية.\n2. جواز تخلف الوعيد لا يعني وقوعه بالنسبة لكل من توعده الله بالعقوبة.\n3. لا يلزم من تخلف الوعيد كذب.\n4. لا يلزم من تخلف الوعيد تجويز عدم خلود الكفار في النار.\n5. الوعد حق العباد على الله."], ["ثالثاً: السعادة والشقاوة والصلاح والأصلح", "السؤال الأول:\n(أ) ما السعادة لغة وشرعًا عند الأشاعرة؟ ومن السعيد؟ وما علامة السعادة عندهم؟\n(ب) «الأشاعرة ينظرون في السعادة والشقاوة إلى ما هو مقدر في علم الله الأزلي»، اشرح هذه العبارة.\n\nالسؤال الثاني:\n(أ) علل:\n1. الخلاف بين الأشاعرة والماتريدية في مسألة السعادة والشقاوة خلاف لفظي.\n2. يصح على رأي الأشاعرة قولك: (أنا مؤمن إن شاء الله).\n3. يرى المعتزلة أن الله لا يفعل ما فيه إضرار بمصالح الناس.\n4. تسمية أهل السنة والجماعة بهذا الاسم.\n5. قالت المعتزلة: يجب على الله فعل الأصلح للعبد.\n(ب) صح/خطأ:\n1. الشقي من ختم له بالكفر حتى ولو كان قبل ذلك مؤمنًا.\n2. ينظر الماتريدية إلى حالة الإنسان التي هو عليها في الدنيا.\n3. مسألة السعادة والشقاوة كانت سببًا لافتراق الإمام الأشعري عن شيخه الجبائي.\n4. ذهب الأشاعرة إلى أن السعادة هي الإيمان في الحال.\n\nالسؤال الثالث:\n(أ) قد يقول قائل: إن كان العبد في علم الله مكتوبًا من الأشقياء فلا داعي لعمله ويعد هذا هروبًا من العمل وتحللاً من المسئولية. بما ترد عليه؟\n(ب) ناقش العبارة: (لا يصح على رأي الماتريدية أن تقول: أنا مؤمن إن شاء الله).\n(ج) ما المسألة التي كانت سببًا في افتراق الإمام الأشعري عن المعتزلة؟ اذكرها تفصيلا.\n\nالسؤال الرابع:\n(أ)\n1. قالت المعتزلة بوجوب الصلاح والأصلح على الله تعالى، فعلام اختلف معتزلة بغداد ومعتزلة البصرة في ذلك؟\n2. بم رد أهل السنة على المعتزلة في مسألة الصلاح والأصلح؟ وما رأيك في هذا الرد؟\n(ب) يرى الأشاعرة أن السعيد لا ينقلب شقيا والشقي لا ينقلب سعيدًا، وضح ذلك.\n(ج) اختر:\n1. السعادة هي الإيمان في الحال عند: (الأشاعرة - الماتريدية - الفلاسفة)\n2. عند الأشاعرة: (الخاتمة تدل على السابقة - السابقة تدل على الخاتمة - الخاتمة لا تدل على السابقة)\n3. عند معتزلة بغداد يجب على الله مراعاة الصلاح والأصلح لعباده في: (الدين - الدنيا - الدنيا والدين)\n4. مسألة الصلاح والأصلح كانت سببًا لانشقاق الإمام أبي الحسن عن: (الماتريدية - المعتزلة - المرجئة)"], ["رابعاً: أسئلة كتاب المعهد المقرر على درسي (بعثة الرسل) و(عصمة الرسل)", "*(المادة العلمية: الصفحات 51، 63)*\n\n**السؤال الأول:**\n\n( أ ) ما حكم بعثة الرسل عند كل من: أهل السنة - المعتزلة - البراهمة؟ مع ذكر دليل كل مذهب.\n(ب) اذكر الحكمة من إرسال الرسل.\n\n**السؤال الثاني:**\n\n( أ ) ما عصمة الرسل؟ وما حكمها؟ وما المستحيل في حقهم عليهم الصلاة والسلام؟\n(ب) وضح بالدليل العصمة التي اتفق عليها العلماء والعصمة التي اختلفوا فيها مع بيان الراجد فيها.\n\n**السؤال الثالث:**\n\n( أ ) ضع علامة (✓) أمام العبارة الصحيحة وعلامة (×) أمام العبارة الخطأ مع تصويب الخطأ، والتعليل للصواب إن وجد:\n\n1. بعثة الرسل واجبة على الله تعالى عقلاً عند أهل السنة.\n2. البراهمة ينكرون البعثة مطلقًا ويرون أن العقل يستغني ببديهته عن البعثة.\n3. عصمة الرسل تثبت بالدليل النقلي فقط.\n4. اختلف العلماء في عصمة الرسل من الصغائر قبل البعثة وبعدها.\n\n(ب) تخير الإجابة الصحيحة مما بين القوسين فيما يلي:\n\n1. البعثة واجبة على الله تعالى لطفًا وحكمة عند: *(أهل السنة - المعتزلة - البراهمة)*\n2. العصمة واجبة للأنبياء والرسل ظاهرًا وباطنًا: *(قبل البعثة فقط - بعد البعثة فقط - قبل البعثة وبعدها)*\n3. المعصية في حق الأنبياء والرسل: *(مستحيلة - جائزة - واجبة)*"], ["خامساً: أسئلة كتاب المعهد المقرر على درسي (الأمانة والصدق) و(التبليغ والفتح والذكاء)", "*(المادة العلمية: الصفحات 72، 83)*\n\n**السؤال الأول:**\n\n( أ ) عرف المصطلحات الآتية:\n\n- الأمانة.\n- الصدق.\n- التبليغ.\n- الفطانة.\n\n(ب) اذكر الأدلة العقلية والنقلية على وجوب اتصاف الرسل بـ (الأمانة والصدق).\n\n**السؤال الثاني:**\n\n( أ ) ما ضد كل من الصفات الآتية مع حكم هذا الضد في حق الرسل؟\n\n- الأمانة.\n- الصدق.\n- التبليغ.\n- الفصاحة والذكاء.\n\n(ب) «التبليغ صفة من صفات الرسل»، اذكر دليلها العقلي والنقلي، وما الضد منها؟ وما حكم هذا الضد؟\n\n**السؤال الثالث:**\n\n( أ ) ضع علامة (✓) أمام العبارة الصحيحة وعلامة (×) أمام العبارة الخطأ مع تصويب الخطأ، والتعليل للصواب إن وجد:\n\n1. يجوز على الرسل الخيانة في القول أو الفعل.\n2. الصدق هو مطابقة الخبر للواقع بحسب اعتقاد المخبر.\n3. التكتم أو إخفاء شيء مما أمر الرسل بتبليغه مستحيل عليهم.\n4. أجمع العلماء على وجوب صفة الفطانة للرسل.\n\n(ب) علل لما يأتي:\n\n1. استحال الخيانة على الرسل عليهم الصلاة والسلام.\n2. استحالة الكذب على الرسل عقلاً ونقلاً.\n3. وجوب اتصاف الرسل بالفطانة."], ["سادساً: أسئلة كتاب المعهد المقرر على درسي (الأعراض البشرية) و(الفرق بين النبي والرسول)", "*(المادة العلمية: الصفحة 96 وما يليها)*\n\n**السؤال الأول:**\n\n( أ ) ما المراد بالأعراض البشرية؟ وما الجائز منها في حق الرسل وما المستحيل؟\n(ب) اذكر الحكمة من تجويز الأعراض البشرية على الرسل عليهم الصلاة والسلام.\n\n**السؤال الثاني:**\n\n( أ ) اذكر الفروق الجوهرية بين النبي والرسول، وما المترتب على هذا الفرق؟\n(ب) هل تعتبر النبوة والرسالة مكتسبة بالعبادة والزهد؟ وضح ذلك مع الاستدلال بالدليل النقلي.\n\n**السؤال الثالث:**\n\n( أ ) تخير الإجابة الصحيحة مما بين القوسين فيما يلي:\n\n1. الأعراض البشرية التي تؤدي إلى نقص في مرتبة الرسل: *(جائزة - مستحيلة - واجبة)*\n2. السهو في الأفعال البلاغية من الرسل: *(مستحيل مطلقا - جائز - مستحيل مع عدم الإقرار عليه)*\n3. النبوة والرسالة صفات: *(وهبية إلهية - كسبية - رياضية نفسية)*\n\n(ب) ضع علامة (✓) أمام العبارة الصحيحة وعلامة (×) أمام العبارة الخطأ مع تصويب الخطأ:\n\n1. يجوز على الرسل الأمراض المنفرة كالجذام والبرص.\n2. كل رسول نبي وليس كل نبي رسولاً.\n3. النوم والاحتلام جائزان في حق الرسل والأنبياء."], ["سابعاً: أسئلة كتاب المعهد المقرر على درسي (المعجزة والكرامة) و(الإهانة والاستدراج)", "*(المادة العلمية: الصفحات 108، 120)*\n\n**السؤال الأول:**\n\n( أ ) عرف المصطلحات الآتية:\n\n- المعجزة لغة واصطلاحًا.\n- الكرامة.\n- المعونة.\n- الاستدراج.\n- الإهانة.\n\n(ب) اذكر شروط المعجزة بالتفصيل، مع بيان وجه استدلال الرسول بها على صدق دعواه.\n\n**السؤال الثاني:**\n\n( أ ) قارن بين المعجزة والكرامة من حيث: (المفهوم - الغرض - وجه الخرق للعادة).\n\n(ب) هل يجوز إظهار الكرامة للولي؟ وما فرق أهل السنة بين الكرامة والاستدراج؟\n\n**السؤال الثالث:**\n\n( أ ) ضع علامة ($\\checkmark$) أمام العبارة الصحيحة وعلامة ($\\times$) أمام العبارة الخطأ مع تصويب الخطأ، والتعليل للصواب إن وجد:\n\n1. المعجزة تقترن بدعوى النبوة مع التحدي.\n2. الكرامة تظهر على يد شخص يظهر الفسق والمجاهر بالمعاصي.\n3. الإهانة هي أمر خارق للعادة يظهر على يد مدعي النبوة كذبًا وفق مراده.\n4. السحر والشعوذة يعتبران من الخوارق الإلهية المكرّمة لصاحبها.\n\n(ب) تخير الإجابة الصحيحة مما بين القوسين فيما يلي:\n\n1. الخارق للعادة الذي يظهر على يد عامة المؤمنين تخليصًا لهم من شدة يسمى: *(كرامة - معونة - استدراج)*\n2. ظهور أمر خارق للعادة على يد مدعي النبوة كذبًا على خلاف مقصوده يسمى: *(إهانة - استدراج - معجزة)*\n3. وقوع الخارق للعادة على يد الفاسق أو الكافر طبق مراده مكرًا به يسمى: *(استدراج - كرامة - إهانة)*"], ["ثامناً: أسئلة كتاب المعهد المقرر على درسي (معجزة القرآن الكريم) و(عموم رسالة النبي وخاتميتها)", "*(المادة العلمية: الصفحات 132، 145)*\n\n**السؤال الأول:**\n\n( أ ) ما وجه إعجاز القرآن الكريم؟ اذكر وجوه الإعجاز بالتفصيل.\n(ب) وضح بالدليل النقلي والعقلي عموم رسالة النبي سيدنا محمد ρ إلى الإنس والجن.\n\n**السؤال الثاني:**\n\n( أ ) ما معنى كون النبي ρ «خاتم النبيين والمرسلين»؟ وما الحكم الشرعي لمن أنكر ختم النبوة به ρ؟\n(ب) استدل بالقرآن والسنة على خاتمية نبوة سيدنا محمد ρ.\n\n**السؤال الثالث:**\n\n( أ ) ضع علامة (✓) أمام العبارة الصحيحة وعلامة (×) أمام العبارة الخطأ مع تصويب الخطأ:\n\n1. معجزة القرآن الكريم معجزة عقلية خالدة إلى يوم القيامة.\n2. نبينا محمد ρ مبعوث إلى الإنس فقط دون الجن.\n3. يجوز بعثة نبي بعد سيدنا محمد ρ إلى قيام الساعة.\n\n(ب) علل لما يلي:\n\n1. خلود معجزة القرآن الكريم دون غيرها من معجزات الأنبياء السابقين.\n2. تكفير من ادعى النبوة بعد النبي محمد ρ أو صدّق من ادعاها."], ["تاسعاً: أسئلة كتاب المعهد المقرر على درسي (وجوب محبة النبي وآله وصحابته) و(الولايات والكرامات)", "**السؤال الأول:**\n\n(أ) ما حكم محبة النبي ﷺ؟ وما دليله من الكتاب والسنة؟\n(ب) اذكر المراد بـ (آل النبي ﷺ) و(صحابة النبي ﷺ)، وما واجبتنا نحوهم؟\n\n**السؤال الثاني:**\n\n(أ) عرف \"الولي\" اصطلاحاً، وما شروط الولاية؟\n(ب) اذكر أدلة أهل السنة على ثبوت الكرامة لأولياء الله تعالى من القرآن الكريم والسنة النبوية.\n\n**السؤال الثالث:**\n\n(أ) صح/خطأ:\n1. محبة النبي ﷺ شرط من شروط تمام الإيمان وليس واجباً.\n2. سب الصحابة رضوان الله عليهم يعتبر كفراً مخرجاً من الملة مطلقاً عند كافة العلماء.\n3. يجوز للولي أن يتحدّى بالكرامة كما يتحدّى النبي بالمعجزة.\n4. الكرامة لا تنقطع بموت الولي عند جمهور أهل السنة.\n(ب) اختر:\n1. محبة آل بيت النبي ﷺ: (واجبة - مستحبة - مباحة)\n2. إثبات الكرامة للأولياء جائز عقلاً وواقع ضمناً عند: (أهل السنة - المعطلة - المعتزلة)\n3. أفضل الصحابة رضوان الله عليهم على الإطلاق هو: (أبو بكر الصديق - عمر بن الخطاب - علي بن أبي طالب)"]];
const answers = [[["السؤال الأول", "أفعال العباد: اضطرارية واختيارية. الله وحده الخالق، وأهل السنة يقولون إن الله يخلق الفعل والعبد يكسبه ويختاره. والجبرية تنفي الاختيار، والمعتزلة تجعل العبد خالقًا لأفعاله استقلالًا."], ["السؤال الثاني", "الأفعال الاختيارية محل خلاف؛ والجبرية تنفي اختيار العبد، والمعتزلة تثبت للعبد إيجاد أفعاله، وأهل السنة يثبتون للعبد الكسب والاختيار مع كون الخلق لله تعالى."], ["السؤال الثالث", "مراحل إيجاد الفعل: الإرادة/الفيض/القصد، القدرة الحادثة، اقتران المقدور بالقدرة (الكسب)، ثم الخلق والإيجاد. والكسب عند الأشاعرة اقتران قدرة العبد الحادثة وإرادته بالفعل المخلوق لله. والكسب عند المعتزلة هو الإيجاد والخلق نفسه."], ["السؤال الرابع", "الأفعال الاضطرارية هي التي لا اختيار للعبد فيها. والكسب عند أهل السنة هو اقتران قدرة العبد الحادثة وإرادته بالفعل المخلوق لله تعالى."]], [["السؤال الأول", "الوعد إخبار عن نفع أو دفع ضر، وحكم وعد الله تعالى للمؤمنين بالجنة أنه لا يتخلف. ومن أدلة ذلك: «إن الله لا يخلف الميعاد» و«ما يبدل القول لدي»."], ["السؤال الثاني", "الوعيد عند الأشاعرة يجوز تخلفه عن بعض العصاة بالعفو. واحتج الماتريدية على امتناع تخلفه بمفاسد، وبيّن المصدر أن الوعيد يختلف عن الوعد وأن تخلف الوعيد لا يلزم منه الكذب."], ["السؤال الثالث", "الوعيد إخبار عن ضرر أو حرمان. القائل بجواز تخلف الوعيد هو الأشاعرة، والقائل بوجوب تنفيذ الوعيد في كل الأفراد هم المعتزلة."], ["السؤال الرابع", "اتفاق الأشاعرة والماتريدية ليس في حكم الوعيد؛ فالأشاعرة يجيزون تخلفه بالعفو. وجواز تخلف الوعيد لا يعني وقوعه لكل من توعده الله بالعقوبة، ولا يلزم منه الكذب، ولا يلزم منه تجويز عدم خلود الكفار في النار."]], [["السؤال الأول", "السعادة عند الأشاعرة هي الموت على الإيمان، والسعيد من ختم له بالإيمان. وينظر الأشاعرة إلى ما هو مقدر في العلم الأزلي."], ["السؤال الثاني", "الخلاف بين الأشاعرة والماتريدية في السعادة والشقاوة خلاف لفظي من جهة النظر إلى الحالة والخاتمة. ويصح على رأي الأشاعرة قول: «أنا مؤمن إن شاء الله». وترى المعتزلة وجوب الصلاح والأصلح، وسُمّي أهل السنة والجماعة بذلك لاتباعهم السنة والجماعة."], ["السؤال الثالث", "العلم الإلهي لا يجبر العبد على العمل؛ فالعبد لا يعلم ما كتب له وعليه أن يعمل. والماتريدية لا يصح عندهم قول: «أنا مؤمن إن شاء الله» لأن الإيمان الحالي معلوم. وسبب افتراق الإمام الأشعري عن المعتزلة مسألة الصلاح والأصلح."], ["السؤال الرابع", "معتزلة بغداد قالوا بمراعاة الصلاح والأصلح في الدنيا والدين، والبصرة في الدين. ورد أهل السنة بأن شيئًا لا يجب على الله تعالى. والسعيد لا ينقلب شقيًا والشقي لا ينقلب سعيدًا عند الأشاعرة."]], [["السؤال الأول", "أهل السنة: بعثة الرسل جائزة عقلًا وليست واجبة على الله. المعتزلة: واجبة لطفًا وحكمة. البراهمة: ينكرون البعثة. ومن حكم إرسال الرسل الهداية وإقامة الحجة وبيان الأحكام."], ["السؤال الثاني", "عصمة الرسل واجبة، والمستحيل في حقهم ما يخل بمقام الرسالة. واتفق العلماء على عصمتهم من الكفر والشرك والكذب في التبليغ، واختلفوا في بعض الصغائر قبل البعثة وبعدها، وذُكر أن الراجح هو العصمة منها."], ["السؤال الثالث", "العبارات: 1 خطأ، 2 صواب، 3 خطأ، 4 صواب. والبعثة واجبة لطفًا وحكمة عند المعتزلة، والعصمة واجبة قبل البعثة وبعدها، والمعصية في حق الأنبياء والرسل مستحيلة."]], [["السؤال الأول", "الأمانة: حفظ الظاهر والباطن عن المحرمات. الصدق: مطابقة الخبر للواقع. التبليغ: إيصال كل ما أُمر الرسل بتبليغه دون زيادة أو نقص. الفطانة: اليقظة والذكاء والقدرة على إقامة الحجة ودفع الشبهات."], ["السؤال الثاني", "ضد الأمانة الخيانة، وضد الصدق الكذب، وضد التبليغ الكتمان، وضد الفصاحة والذكاء البلادة. وهذه الأضداد مستحيلة في حق الرسل. والتبليغ صفة واجبة في حقهم ودليلها العقلي والنقلي ثابت."], ["السؤال الثالث", "العبارات: 1 خطأ، 2 صواب، 3 صواب، 4 صواب. واستحالت الخيانة والكذب والكتمان في حق الرسل، ووجب اتصافهم بالفطانة."]], [["السؤال الأول", "الأعراض البشرية هي الأحوال المتغيرة التي لا تنقص مرتبة الرسل؛ كالأكل والشرب والبيع والشراء والزواج والنوم والمرض غير المنفر. ومن الحكم في تجويزها إقامة التشريع والاقتداء والصبر وبيان بشرية الرسل."], ["السؤال الثاني", "كل رسول نبي وليس كل نبي رسولًا. والرسول رجل حر من البشر أوحي إليه بشرع وأمر بتبليغه، والنبي أوحي إليه بشرع ولم يؤمر بتبليغ شرع جديد أو يتبع شرعًا سابقًا بحسب المادة. والنبوة والرسالة وهبية إلهية وليستا مكتسبتين بالعبادة والزهد."], ["السؤال الثالث", "الإجابات: 1 مستحيلة، 2 مستحيل مع عدم الإقرار عليه، 3 وهبية إلهية. والعبارتان: الأولى خطأ، والثانية صواب، والثالثة خطأ وفق المادة."]], [["السؤال الأول", "المعجزة: أمر خارق للعادة يظهر على يد مدعي النبوة مع التحدي والعجز عن المعارضة. والكرامة: أمر خارق يظهر على يد ولي بلا دعوى نبوة. والمعونة: خارق يظهر على يد عامة المؤمنين تخليصًا من شدة. والاستدراج: خارق يظهر على يد فاسق أو كافر طبق مراده مكرًا به. والإهانة: خارق يظهر على يد مدعي النبوة كذبًا على خلاف مقصوده."], ["السؤال الثاني", "المعجزة تقترن بدعوى النبوة والتحدي وتكون دليلًا على صدق الرسول، أما الكرامة فتظهر للولي ولا تكون مع تحدٍّ بالنبوة. ويُعرف الفرق بين الكرامة والاستدراج بالنظر إلى حال صاحب الخارق وكونه موافقًا للطاعة أو واقعًا مكرًا بالفاسق أو الكافر."], ["السؤال الثالث", "العبارات: 1 صواب، 2 خطأ، 3 خطأ، 4 خطأ. والإجابات: 1 معونة، 2 إهانة، 3 استدراج."]], [["السؤال الأول", "وجوه إعجاز القرآن تشمل البلاغة والفصاحة، والإخبار بالغيب والمستقبل، وأخبار الأمم السابقة، وما اشتمل عليه من جوانب تشريعية وعلمية بحسب المادة. ورسالة النبي سيدنا محمد ﷺ عامة إلى الإنس والجن."], ["السؤال الثاني", "معنى خاتم النبيين والمرسلين أنه آخر الأنبياء والرسل ولا نبي بعده. ودلت آيات القرآن وأحاديث السنة على خاتمية نبوته ﷺ."], ["السؤال الثالث", "1 صواب: معجزة القرآن الكريم معجزة عقلية خالدة. 2 خطأ: النبي محمد ﷺ مبعوث إلى الإنس والجن. 3 خطأ: لا يجوز بعثة نبي بعد سيدنا محمد ﷺ. وخلود القرآن لأنه معجزة باقية، وتكفير من ادعى النبوة بعده أو صدقه لإنكار ختم النبوة."]], [["السؤال الأول", "محبة النبي ﷺ واجبة وشرط من شروط كمال الإيمان. وآل النبي هم أقاربه المؤمنون بحسب التفصيل المذكور في المادة، والصحابي من لقي النبي ﷺ مؤمنًا به ومات على الإسلام، وواجبنا محبتهم وتوقيرهم والدعاء لهم والكف عن الخوض في النزاعات بينهم."], ["السؤال الثاني", "الولي هو من عرف الله تعالى وداوم على الطاعة واجتنب المعاصي. ومن شروط الولاية الإسلام والتكليف واتباع الشريعة وترك الفسق. وتثبت الكرامة لأولياء الله تعالى بالقرآن والسنة."], ["السؤال الثالث", "العبارات: 1 خطأ، 2 خطأ، 3 خطأ، 4 صواب. والاختيارات: 1 واجبة، 2 أهل السنة، 3 أبو بكر الصديق."]]];
const nav=document.getElementById('nav'), q=document.getElementById('questions'), a=document.getElementById('answers');
sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent='القسم '+(i+1);b.onclick=()=>document.getElementById('s'+i).scrollIntoView({behavior:'smooth'});nav.appendChild(b);
let sec=document.createElement('section');sec.id='s'+i;sec.innerHTML='<h2>'+s[0]+'</h2>'+s[1].split('\n\n').map(x=>'<div class="question">'+x.replace(/\n/g,'<br>')+'</div>').join('');q.appendChild(sec);});
answers.forEach((section,i)=>{
  let d=document.createElement('div');
  d.className='answer';
  d.innerHTML='<h3>القسم '+(i+1)+'</h3>'+section.map(item=>
    '<div class="qa-answer"><h4>'+item[0]+'</h4><p>'+item[1]+'</p></div>'
  ).join('');
  a.appendChild(d);
});
document.getElementById('search').addEventListener('input',e=>{let t=e.target.value.trim();document.querySelectorAll('#questions section').forEach(s=>s.classList.toggle('hidden',t&&!s.innerText.includes(t)));});
</script></body></html>
