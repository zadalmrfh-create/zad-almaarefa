<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حل الامتحان | زاد المعرفة</title><link rel="icon" href="../../images/logo.png"><link rel="stylesheet" href="code-exams.css"></head><body><main class="wrap"><header><a href="code-exams.html">← جميع الامتحانات</a><h1 id="title">جارٍ تحميل الامتحان...</h1><p id="details"></p></header><p id="status" role="status"></p><iframe id="examFrame" title="الامتحان" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe><p class="note">الامتحان يعمل في مساحة مستقلة لحماية حسابك وبياناتك. نتائج كود الامتحان لا تُحفظ في لوحة التحكم تلقائيًا.</p></main><script type="module">
import {db} from '../../firebase-config.js';import {doc,getDoc,getDocs,collection,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status');if(!id||id.length>150){status.textContent='رابط الامتحان غير صحيح.'}else{try{const s=await getDoc(doc(db,'codeExams',id));if(!s.exists()||!s.data().published){status.textContent='الامتحان غير متاح حاليًا.'}else{const x=s.data();document.title=x.title+' | زاد المعرفة';document.getElementById('title').textContent=x.title;document.getElementById('details').textContent=[x.grade,x.subject].filter(Boolean).join(' • ');const frame=document.getElementById('examFrame');if(x.chunkCount){const parts=await getDocs(query(collection(db,'codeExams',id,'chunks'),orderBy('index')));if(parts.size!==x.chunkCount)throw Error('لم تكتمل أجزاء الامتحان');frame.srcdoc=parts.docs.map(p=>p.data().content).join('');}else frame.srcdoc=x.code||'';frame.hidden=false;status.textContent='';}}catch(e){status.textContent='تعذر فتح الامتحان: '+e.message;}}
</script></body></html>
