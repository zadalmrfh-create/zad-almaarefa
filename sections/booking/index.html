<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز حصة | زاد المعرفة</title>
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --gold:#c9a84c;
  --gold-light:#e8c96d;
  --bg:#f7f7f5;
  --card:#fff;
  --text:#172033;
  --muted:#68758a;
  --border:#d9dee8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Arial,sans-serif;background:linear-gradient(135deg,#f8f5ec,#eef1f6);color:var(--text)}
.booking-page{min-height:100vh;padding:30px 16px;display:flex;align-items:center;justify-content:center}
.booking-box{width:min(820px,100%);background:var(--card);border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.12)}
.back-link{display:inline-block;color:var(--text);text-decoration:none;font-weight:700;margin-bottom:22px}
.back-link:hover{color:var(--gold)}
.brand{display:flex;gap:16px;align-items:center;margin-bottom:24px}
.brand img{width:70px;height:70px;object-fit:contain}
.brand h1{margin:0 0 6px;color:var(--gold);font-size:30px}
.brand p{margin:0;color:var(--muted);line-height:1.8}
.booking-form{display:grid;gap:15px}
.booking-form label{display:grid;gap:7px;font-weight:700}
.booking-form input,.booking-form select,.booking-form textarea{
  width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;
  background:#fff;color:var(--text);font:inherit;outline:none;transition:.2s
}
.booking-form input:focus,.booking-form select:focus,.booking-form textarea:focus{
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.14)
}
.booking-two{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.submit-btn{
  border:0;border-radius:12px;padding:13px 18px;background:var(--gold);color:#fff;
  font:inherit;font-weight:800;cursor:pointer;transition:.2s
}
.submit-btn:hover{background:#b49338;transform:translateY(-1px)}
.booking-status{min-height:26px;font-weight:700;text-align:center}
.booking-status.success{color:#16834b}
.booking-status.error{color:#c0392b}
@media(max-width:650px){
  .booking-page{padding:15px 10px}
  .booking-box{padding:20px 14px;border-radius:18px}
  .booking-two{grid-template-columns:1fr}
  .brand{align-items:flex-start}
  .brand img{width:55px;height:55px}
  .brand h1{font-size:23px}
}

.auto-teacher-hint{display:block;margin-top:7px;color:#9fb0c8;font-size:12px;line-height:1.6}#bookingTeacher:disabled{opacity:1;cursor:not-allowed;background:#111a2b;color:#f3d97b;border-color:rgba(212,168,67,.45)}

</style>

<link rel="stylesheet" href="../../assets/translation.css">
<script src="../../assets/translation.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="../../content-protection.js" defer></script>
</head>
<body>
  <main class="booking-page">
    <div class="booking-box">
      <a class="back-link" href="../../index.html">← العودة للرئيسية</a>
      <div class="brand">
        <img src="../../images/logo.png" alt="زاد المعرفة">
        <div>
          <h1>احجز حصتك الآن</h1>
          <p>اختر القسم والمادة التي تريد الدراسة فيها، ثم أرسل طلبك وسيتم تحديد المعلم تلقائيًا.</p>
        </div>
      </div>

      <form id="bookingForm" class="booking-form">
        <div class="booking-two">
          <label>القسم المطلوب
            <select name="section" id="bookingSection" required>
              <option value="">اختر القسم</option>
              <option value="القرآن الكريم">القرآن الكريم</option>
              <option value="التزكية والتربية">التزكية والتربية</option>
              <option value="اللغة العربية">اللغة العربية</option>
              <option value="العلوم الشرعية">العلوم الشرعية</option>
              <option value="التعليم الأزهري">التعليم الأزهري</option>
              <option value="البرمجة وتكنولوجيا المعلومات">البرمجة وتكنولوجيا المعلومات</option>
            </select>
          </label>

          <label>نظام التعليم (اختياري)
            <select name="educationType">
              <option value="غير مرتبط بنظام تعليمي">غير مرتبط بنظام تعليمي</option>
              <option value="أزهري">أزهري</option>
              <option value="عام">عام</option>
            </select>
          </label>
        </div>

        <label>الاسم بالكامل
          <input name="fullName" required maxlength="100" autocomplete="name">
        </label>

        <div class="booking-two">
          <label>رقم الهاتف / واتساب
            <input name="phone" required inputmode="tel" autocomplete="tel">
          </label>
          <label>البريد الإلكتروني
            <input name="email" type="email" required autocomplete="email">
          </label>
        </div>

        <div class="booking-two">
          <label>المرحلة / المستوى (اختياري)
            <input name="stage" placeholder="مثال: إعدادي، ثانوي، طالب علم">
          </label>
          <label>الصف الدراسي (اختياري)
            <input name="grade" placeholder="مثال: أولى ثانوي أزهري">
          </label>
        </div>

        <label>المادة المطلوبة
          <input name="subject" required maxlength="150"
                 placeholder="مثال: حفظ القرآن، التجويد، النحو، الفقه، التزكية...">
        </label>

        <div class="booking-two">
          <label>نوع الحصة
            <select name="lessonType" required>
              <option value="حصة فردية">حصة فردية</option>
              <option value="مراجعة">مراجعة</option>
              <option value="حل تدريبات / امتحانات">حل تدريبات / امتحانات</option>
              <option value="تأسيس">تأسيس</option>
              <option value="متابعة">متابعة</option>
              <option value="تحفيظ">تحفيظ</option>
            </select>
          </label>

          <label>المعلم
            <select name="teacherUid" id="bookingTeacher" disabled aria-disabled="true">
              <option value="">يتم تحديد المعلم تلقائيًا</option>
            </select>
            <small id="teacherAutoHint" class="auto-teacher-hint">المعلم يتحدد تلقائيًا حسب المادة ولا يمكن تغييره يدويًا.</small>
          </label>
        </div>

        <div class="booking-two">
          <label>اليوم الأول المناسب
            <select name="preferredDay1" required>
              <option value="">اختر اليوم</option>
              <option>السبت</option><option>الأحد</option><option>الإثنين</option>
              <option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option>
              <option>الجمعة</option>
            </select>
          </label>
          <label>اليوم الثاني المناسب
            <select name="preferredDay2" required>
              <option value="">اختر اليوم</option>
              <option>السبت</option><option>الأحد</option><option>الإثنين</option>
              <option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option>
              <option>الجمعة</option>
            </select>
          </label>
        </div>

        <div class="booking-two">
          <label>الفترة المناسبة
            <select name="preferredPeriod" required>
              <option>صباحًا</option><option>ظهرًا</option><option>مساءً</option>
            </select>
          </label>
          <label>طريقة الحصة
            <select name="lessonMode" required>
              <option>أونلاين</option><option>حضوري</option>
            </select>
          </label>
        </div>

        <label>ملاحظات إضافية (اختياري)
          <textarea name="notes" rows="4" maxlength="500"
                    placeholder="اكتب أي تفاصيل تساعدنا على ترشيح الحصة والمعلم المناسبين."></textarea>
        </label>

        <button class="submit-btn" type="submit">إرسال طلب الحجز</button>
        <div id="bookingStatus" class="booking-status" aria-live="polite"></div>
      </form>
    </div>
  </main>
  <script type="module" src="./booking.js"></script>
</body>
</html>
