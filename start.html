<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابدأ من هنا — زاد المعرفة</title><link rel="icon" href="images/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#09111f;color:#f8fafc;min-height:100vh}.top{padding:18px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263449}.top a{color:#e8c96d;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:60px 18px}.badge{color:#e8c96d;font-weight:800}.wrap h1{font-size:clamp(30px,5vw,52px);margin:7px 0}.wrap>p{color:#aeb8c8;line-height:1.9}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.steps span{padding:8px 12px;border:1px solid #2c3b50;border-radius:999px;font-size:12px}.panel{background:#101d33;border:1px solid rgba(201,168,76,.24);border-radius:24px;padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid #314157;background:#0c1728;color:#fff;border-radius:16px;padding:18px;cursor:pointer;font:inherit;text-align:right}.choice:hover,.choice.active{border-color:#c9a84c;background:rgba(201,168,76,.12)}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.go{display:inline-flex;padding:13px 20px;border-radius:13px;background:#c9a84c;color:#08111e;text-decoration:none;font-weight:900}.secondary{background:#16243a;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding-top:35px}}</style></head><body><header class="top"><strong>زاد المعرفة</strong><a href="index.html">← الرئيسية</a></header><main class="wrap"><span class="badge">🧭 ابدأ من هنا</span><h1>اختَر طريقك في أقل من دقيقة</h1><p>حدد مرحلتك ثم القسم والمادة، وسننقلك مباشرة إلى المحتوى المناسب. الاختبارات موجودة داخل المكتبة وليست في القائمة الرئيسية.</p><div class="steps"><span>1️⃣ المرحلة</span><span>2️⃣ القسم</span><span>3️⃣ المادة</span><span>4️⃣ ابدأ التعلم</span></div><section class="panel"><h2 id="stepTitle">اختر مرحلتك</h2><div id="choices" class="grid"></div><div class="actions"><a id="continueBtn" class="go" href="#" hidden>متابعة ←</a><a class="go secondary" href="sections/library.html">فتح المكتبة مباشرة</a></div></section></main><script>const data={stages:['ابتدائي','إعدادي','ثانوي أزهري','تعلم حر'],sections:['التعليم الأزهري','القرآن الكريم','اللغة العربية','العلوم الشرعية','التزكية والتربية'],subjects:{'التعليم الأزهري':['اللغة العربية','العلوم الشرعية','الفلسفة والمنطق','القرآن الكريم'],'القرآن الكريم':['الحفظ والتلاوة','التجويد','التفسير','القراءات'],'اللغة العربية':['النحو','الصرف','البلاغة','الأدب'],'العلوم الشرعية':['الفقه','العقيدة','الحديث','السيرة'],'التزكية والتربية':['التزكية','الإرشاد التربوي']}};let state={},step=0;const titles=['اختر مرحلتك','اختر القسم','اختر المادة'];function render(){stepTitle.textContent=titles[step];const arr=step===0?data.stages:step===1?data.sections:(data.subjects[state.section]||['المحتوى المتاح']);choices.innerHTML=arr.map(x=>`<button class="choice">${x}</button>`).join('');[...choices.children].forEach(b=>b.onclick=()=>{[...choices.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');if(step===0)state.stage=b.textContent;else if(step===1)state.section=b.textContent;else state.subject=b.textContent;continueBtn.hidden=false;continueBtn.textContent=step<2?'متابعة ←':'ابدأ التعلم ←'});continueBtn.onclick=e=>{e.preventDefault();if(step<2){step++;continueBtn.hidden=true;render()}else{const map={'التعليم الأزهري':'sections/Azhar/azhar.html','القرآن الكريم':'sections/Quran/quran.html','اللغة العربية':'sections/Arabic/arabic.html','العلوم الشرعية':'sections/Sharia/sharia.html','التزكية والتربية':'sections/Tazkea/tazkea.html'};location.href=(map[state.section]||'sections/library.html')+'?subject='+encodeURIComponent(state.subject||'')}}}render()</script></body></html>
