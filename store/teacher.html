<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحة معلم متجر زاد المعرفة</title><link rel="stylesheet" href="app.css?v=20261103-secure4"></head><body><div class="shell"><header class="topbar"><a class="brand" href="./"><img src="../images/logo.png" alt="شعار زاد المعرفة">مساحة المعلم — المتجر</a><nav class="nav"><a href="./">المتجر</a><a href="../dashboard/teacher/index.html">لوحة المعلم الأساسية</a></nav></header><div id="gate" class="notice">جار فحص حساب المعلم...</div><main id="main" class="hidden"><h1>الكورسات المرتبطة بحسابك</h1><p class="hint">الإدارة تعيّن UID المعلم في المنتج، وبعدها يمكنك إرسال مسودات الدروس للمراجعة. لا يمكنك اعتماد المدفوعات أو نشر الدروس مباشرة.</p><div id="courses" class="list"></div><div class="panel" style="max-width:750px;margin-top:20px"><h2>إرسال مسودة درس جديد</h2><form id="draftForm" class="list"><div class="field"><label>الكورس</label><select id="course" required></select></div><div class="field"><label>عنوان الدرس</label><input id="title" maxlength="160" required></div><div class="field"><label>ترتيب الدرس</label><input id="position" type="number" min="1" max="999" value="1" required></div><div class="field"><label>الوصف</label><textarea id="description" maxlength="1200"></textarea></div><div class="field"><label>رابط فيديو HTTPS (قد يظهر للمشتركين بعد اعتماد الإدارة)</label><input id="videoUrl" type="url" placeholder="https://..."></div><button class="primary">إرسال للمراجعة</button></form></div><h2>مسوداتي</h2><div id="drafts" class="list"></div></main></div><div id="toast"></div><script type="module" src="teacher.js?v=20261103-1"></script></body></html>
