<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1930"><meta name="description" content="تتبع حالة طلبك باستخدام الكود السري الخاص بك."><title>تتبع الطلب | MALEK</title><link rel="icon" href="./favicon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./css/styles.css"></head><body><div id="siteHeader"></div><main id="main"><section class="container page-hero"><span class="eyebrow">ORDER TRACKING</span><h1>كل تحديث <span class="accent">في مكان واحد.</span></h1><p>ادخل كود التتبع السري الذي ظهر لك بعد تسجيل الطلب. لا تشارك هذا الكود مع الآخرين.</p></section><section class="container section-sm"><div class="glass" style="max-width:750px;margin:auto"><form id="trackingForm"><div class="form-group"><label for="trackingCode">كود التتبع</label><div class="actions" style="flex-wrap:nowrap"><input id="trackingCode" class="input" dir="ltr" maxlength="24" placeholder="أدخل الكود هنا" autocomplete="off" required><button type="submit" class="btn btn-primary">تتبع ←</button></div></div></form><div id="trackAlert" hidden class="alert"></div><div id="trackingResult" class="hide"><div class="panel-head"><div><small>رقم الطلب</small><h3 id="resultOrderId" dir="ltr" style="margin-bottom:6px"></h3></div><span class="status-pill" id="resultStatus"></span></div><div class="tracking-timeline" id="trackTimeline"></div><p class="muted" style="font-size:12px">آخر تحديث: <span id="lastUpdate">—</span></p><button id="notifyButton" class="btn btn-secondary" type="button">تفعيل تنبيه المتصفح أثناء فتح الصفحة</button><div class="note-box">التحديثات تظهر مباشرة أثناء فتح صفحة التتبع. التنبيهات ليست إشعارات دفع في الخلفية.</div></div></div></section></main><div id="siteFooter"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="./js/track.js"></script></body></html>
