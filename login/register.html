<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>إنشاء حساب | زاد المعرفة</title>

  <link
    rel="icon"
    type="image/png"
    href="../images/logo.png.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body>

<main class="login-page">

  <a
    class="back-home"
    href="../index.html"
  >
    ← العودة إلى المنصة
  </a>


  <section class="login-card">

    <div class="brand">

      <img
        src="../images/logo.png.png"
        alt="زاد المعرفة"
      >

      <h1>
        إنشاء حساب
      </h1>

      <p>
        انضم إلى منصة زاد المعرفة
      </p>

    </div>


    <div>

      <label for="role">
        نوع الحساب
      </label>


      <select
        id="role"
        required
        style="
          width:100%;
          margin-top:8px;
          margin-bottom:18px;
        "
      >

        <option value="student">
          🎓 طالب
        </option>

        <option value="teacher">
          👨‍🏫 معلم
        </option>

      </select>


      <button
        id="googleRegister"
        class="submit-btn"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        إنشاء الحساب باستخدام Google

      </button>


      <p
        id="message"
        class="message"
        role="alert"
      ></p>

    </div>


    <div class="divider">
      <span>أو</span>
    </div>


    <p class="register">

      لديك حساب بالفعل؟

      <a href="index.html">
        تسجيل الدخول
      </a>

    </p>

  </section>

</main>


<script
  type="module"
  src="register.js"
></script>

</body>
</html>
