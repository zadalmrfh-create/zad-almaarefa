<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الدخول إلى زاد المعرفة | منصة تعليمية احترافية</title>

  <link rel="icon" type="image/png" href="../images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="login.css">

<link rel="stylesheet" href="../assets/translation.css">
<script src="../assets/translation.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>

<body>

<main class="login-page">

  <a class="back-home" href="../index.html">
    ← العودة إلى المنصة
  </a>


  <section class="login-card">

    <div class="brand">

      <img
        src="../images/logo.png"
        alt="زاد المعرفة"
      >

      <h1>زاد المعرفة</h1>

      <p>مرحبًا بعودتك إلى عالم المعرفة 👋</p>

    </div>


    <p
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></p>


    <!-- =========================
         البريد الإلكتروني
    ========================== -->

    <form id="emailLoginForm">

      <div class="field">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          كلمة المرور
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >

          <button
            id="togglePassword"
            type="button"
          >
            👁
          </button>

        </div>

      </div>


      <div class="form-row">

        <label class="remember">

          <input
            id="rememberMe"
            type="checkbox"
            checked
          >

          تذكرني

        </label>


        <a href="#" id="forgotPassword">
          نسيت كلمة المرور؟
        </a>

      </div>


      <button
        id="emailLoginBtn"
        class="submit-btn"
        type="submit"
      >
        تسجيل الدخول
      </button>

    </form>


    <div class="divider">
      <span>أو تابع باستخدام</span>
    </div>


    <!-- =========================
         Google
    ========================== -->

    <div class="social-login">

      <button
        id="googleLogin"
        class="provider-btn"
        type="button"
      >

        <svg class="provider-icon" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"
          />
          <path
            fill="#34A853"
            d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75z"
          />
          <path
            fill="#FBBC05"
            d="M6.54 13.83A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.83V7.64H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.36l3.24-2.53z"
          />
          <path
            fill="#EA4335"
            d="M12 6.14c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 7.86 9.46 6.14 12 6.14z"
          />
        </svg>

        <span>المتابعة باستخدام Google</span>

      </button>


      <!-- Apple -->

      <button
        id="appleLogin"
        class="provider-btn"
        type="button"
      >
        <span class="apple-icon"></span>
        <span>المتابعة باستخدام Apple</span>
      </button>

    </div>


    <p class="register">

      ليس لديك حساب؟

      <a href="register.html">
        إنشاء حساب جديد
      </a>

    </p>

  </section>

</main>


<script
  type="module"
  src="login.js?v=4"
></script>

</body>
</html>
