</head><body><header class="reviews-header"><a href="../index.html" class="home-btn">← الرئيسية</a><div class="brand"><img src="../images/logo.png" alt="زاد المعرفة"><div><h1>آراء الطلاب</h1><p>تجارب وانطباعات طلاب منصة زاد المعرفة</p></div></div></header><main><section class="intro"><span>💬 تجارب طلابنا</span><h2>ماذا يقول طلاب زاد المعرفة؟</h2><p>نستعرض هنا الآراء المنشورة من الطلاب، مع إمكانية إرسال رأيك بعد تسجيل الدخول.</p></section><section id="reviewsGrid" class="reviews-grid"><div class="loading">جارٍ تحميل الآراء...</div></section><section class="review-form-card"><h2>شاركنا رأيك</h2><form id="reviewForm"><input id="reviewName" placeholder="اسمك" required maxlength="60"><textarea id="reviewText" placeholder="اكتب رأيك في المنصة..." required maxlength="500"></textarea><select id="reviewRating"><option value="5">★★★★★ — ممتاز</option><option value="4">★★★★☆ — جيد جدًا</option><option value="3">★★★☆☆ — جيد</option></select><button type="submit">إرسال الرأي</button><p id="formMessage" role="status"></p></form></section></main><script type="module" src="reviews.js"></script></body></html>
