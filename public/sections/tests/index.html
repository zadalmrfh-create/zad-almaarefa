<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبارات | زاد المعرفة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:#111c2e;--card:#1e293b;--line:#334155;--gold:#f0c040;--muted:#94a3b8;--text:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:#e2e8f0;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:24px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.back{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--card);color:var(--gold);text-decoration:none;font-weight:800;border:1px solid var(--line)}.hero{text-align:center;padding:34px 18px;border-radius:24px;background:radial-gradient(circle at top,rgba(240,192,64,.14),transparent 45%),linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--line)}.hero .icon{font-size:54px}.hero h1{margin:8px 0;color:var(--gold);font-size:32px}.hero p{margin:0;color:var(--muted)}.group{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.group h2{margin:0 0 8px;color:var(--gold);font-size:22px}.group .desc{margin:0 0 18px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.choice,.subject{position:relative;display:block;width:100%;padding:20px;border-radius:16px;background:var(--card);color:var(--text);text-decoration:none;border:1px solid var(--line);transition:.2s;min-height:105px;text-align:right;font:inherit;cursor:pointer}.choice:hover,.choice.selected,.subject:hover:not(.disabled){transform:translateY(-3px);border-color:var(--gold)}.choice.selected{box-shadow:0 0 0 2px rgba(240,192,64,.12);background:linear-gradient(145deg,#24334a,#17243a)}.emoji{font-size:28px}.choice strong,.subject strong{display:block;margin-top:8px;font-size:17px}.choice small,.subject small{display:block;margin-top:5px;color:var(--muted);line-height:1.7}.subject.disabled{opacity:.58;cursor:not-allowed}.soon{position:absolute;top:12px;left:12px;background:#334155;color:#cbd5e1;border-radius:999px;padding:3px 8px;font-size:11px}.active{border-color:rgba(240,192,64,.55);background:linear-gradient(145deg,#1e293b,#17243a)}.hidden{display:none!important}.crumb{margin-top:18px;padding:12px 14px;background:#0b1323;border:1px solid var(--line);border-radius:12px;color:#cbd5e1;font-size:13px}.crumb b{color:var(--gold)}.empty{padding:18px;border:1px dashed #475569;border-radius:14px;color:#94a3b8;text-align:center}.reset{margin-top:14px;border:0;background:transparent;color:var(--gold);font:inherit;font-weight:700;cursor:pointer}.available-note{margin-top:14px;color:#cbd5e1;font-size:13px}.available-note b{color:var(--gold)}@media(max-width:600px){.hero h1{font-size:25px}.group{padding:16px}.grid{grid-template-columns:1fr}.choice,.subject{min-height:95px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../library.html">← العودة إلى المكتبة</a></div>
  <div class="hero"><div class="icon">📝</div><h1>قسم الاختبارات</h1><p>اختر المرحلة ثم الصف للوصول إلى اختباراتك بسهولة</p></div>

  <section class="group" id="stageSection">
    <h2>🎓 اختر المرحلة</h2>
    <p class="desc">قسم الاختبارات متاح للمرحلة الإعدادية والثانوية الأزهرية.</p>
    <div class="grid">
      <button class="choice" data-stage="prep"><span class="emoji">📘</span><strong>المرحلة الإعدادية</strong><small>الأول الإعدادي • الثاني الإعدادي • الثالث الإعدادي</small></button>
      <button class="choice" data-stage="secondary"><span class="emoji">🏛️</span><strong>الثانوية الأزهرية</strong><small>الأول الثانوي • الثاني الثانوي • الثالث الثانوي</small></button>
    </div>
  </section>

  <section class="group hidden" id="gradeSection">
    <h2 id="gradeTitle">📚 اختر الصف</h2>
    <p class="desc">اختر صفك لعرض المواد والاختبارات المتاحة.</p>
    <div class="grid" id="gradeGrid"></div>
    <button class="reset" id="changeStage">↩ تغيير المرحلة</button>
  </section>

  <section class="group hidden" id="subjectsSection">
    <h2 id="subjectsTitle">📖 المواد</h2>
    <div class="crumb" id="crumb"></div>
    <div class="grid" id="subjectsGrid" style="margin-top:16px"></div>
    <button class="reset" id="changeGrade">↩ تغيير الصف</button>
  </section>
</div>
<script>
const stageNames={prep:'المرحلة الإعدادية',secondary:'الثانوية الأزهرية'};
const grades={
  prep:[
    {id:'prep1',name:'الأول الإعدادي',icon:'1️⃣'},
    {id:'prep2',name:'الثاني الإعدادي',icon:'2️⃣'},
    {id:'prep3',name:'الثالث الإعدادي',icon:'3️⃣'}
  ],
  secondary:[
    {id:'sec1',name:'الأول الثانوي الأزهري',icon:'1️⃣'},
    {id:'sec2',name:'الثاني الثانوي الأزهري',icon:'2️⃣'},
    {id:'sec3',name:'الثالث الثانوي الأزهري',icon:'3️⃣'}
  ]
};
const subjectSets={
  prep:[
    ['📚','اللغة العربية'],['🕌','الدراسات الإسلامية'],['➗','الرياضيات'],['🔬','العلوم'],['🌍','الدراسات الاجتماعية'],['🇬🇧','اللغة الإنجليزية']
  ],
  secondary:[
    ['📚','النحو'],['✍️','الصرف'],['🎨','البلاغة'],['📖','الأدب والنصوص والمطالعة'],['📜','التفسير'],['🕌','الحديث'],['☝️','التوحيد'],['📗','الفقه'],['💻','البرمجة وتكنولوجيا المعلومات'],['🧠','الفلسفة والمنطق']
  ]
};
const liveTests={
  'النحو':'nahw.html',
  'البلاغة':'balagha.html',
  'التوحيد':'tawheed.html'
};
let selectedStage=null,selectedGrade=null;
const stageSection=document.getElementById('stageSection'),gradeSection=document.getElementById('gradeSection'),subjectsSection=document.getElementById('subjectsSection'),gradeGrid=document.getElementById('gradeGrid'),subjectsGrid=document.getElementById('subjectsGrid'),crumb=document.getElementById('crumb');

document.querySelectorAll('[data-stage]').forEach(btn=>btn.addEventListener('click',()=>selectStage(btn.dataset.stage)));
document.getElementById('changeStage').onclick=resetStage;
document.getElementById('changeGrade').onclick=()=>{subjectsSection.classList.add('hidden');gradeSection.classList.remove('hidden');gradeSection.scrollIntoView({behavior:'smooth',block:'start'});};

function selectStage(stage){
  selectedStage=stage; selectedGrade=null;
  document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('selected',b.dataset.stage===stage));
  gradeGrid.innerHTML=grades[stage].map(g=>`<button class="choice" data-grade="${g.id}"><span class="emoji">${g.icon}</span><strong>${g.name}</strong><small>عرض المواد والاختبارات الخاصة بهذا الصف</small></button>`).join('');
  gradeGrid.querySelectorAll('[data-grade]').forEach(btn=>btn.addEventListener('click',()=>selectGrade(btn.dataset.grade)));
  gradeSection.classList.remove('hidden'); subjectsSection.classList.add('hidden');
  document.getElementById('gradeTitle').textContent='📚 اختر الصف — '+stageNames[stage];
  gradeSection.scrollIntoView({behavior:'smooth',block:'start'});
}
function selectGrade(id){
  selectedGrade=grades[selectedStage].find(g=>g.id===id);
  crumb.innerHTML=`<b>${stageNames[selectedStage]}</b> ← ${selectedGrade.name}`;
  document.getElementById('subjectsTitle').textContent='📖 المواد — '+selectedGrade.name;
  const subjects=subjectSets[selectedStage];
  subjectsGrid.innerHTML=subjects.map(([emoji,name])=>{
    const href=selectedStage==='secondary' ? liveTests[name] : null;
    if(href){return `<a class="subject active" href="${href}"><span class="emoji">${emoji}</span><strong>${name}</strong><small>فتح الاختبار المتاح حاليًا</small></a>`;}
    return `<div class="subject disabled"><span class="soon">قريبًا</span><span class="emoji">${emoji}</span><strong>${name}</strong><small>سيتم إضافة اختبارات هذه المادة قريبًا</small></div>`;
  }).join('');
  if(selectedStage==='secondary') subjectsGrid.insertAdjacentHTML('beforeend','<div class="available-note" style="grid-column:1/-1"><b>ملاحظة:</b> اختبارات النحو والبلاغة والتوحيد الحالية ظاهرة مؤقتًا داخل صفوف الثانوية إلى أن يتم توزيع كل اختبار على صفه المحدد.</div>');
  subjectsSection.classList.remove('hidden');
  subjectsSection.scrollIntoView({behavior:'smooth',block:'start'});
}
function resetStage(){
  selectedStage=null;selectedGrade=null;gradeSection.classList.add('hidden');subjectsSection.classList.add('hidden');document.querySelectorAll('[data-stage]').forEach(b=>b.classList.remove('selected'));stageSection.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
