<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الكتاب — زاد المعرفة</title><link rel="icon" href="../images/logo.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Cairo;background:#08111f;color:#f8fafc}.top{padding:16px 5%;border-bottom:1px solid #263449;display:flex;justify-content:space-between}.top a{color:#e8c96d;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:50px 18px}.book{display:grid;grid-template-columns:220px 1fr;gap:30px;background:#101d33;border:1px solid rgba(201,168,76,.25);border-radius:24px;padding:28px}.cover{min-height:280px;border-radius:18px;background:linear-gradient(145deg,#1b2d48,#0c1728);display:grid;place-items:center;font-size:82px;border:1px solid #314157}.tag{display:inline-block;background:rgba(201,168,76,.15);color:#e8c96d;border-radius:999px;padding:6px 10px;font-size:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:900;background:#c9a84c;color:#08111f}.btn.alt{background:#17263c;color:#fff;border:1px solid #314157}p{line-height:1.9;color:#b8c2d1}@media(max-width:650px){.book{grid-template-columns:1fr}.cover{min-height:180px}}</style></head><body><header class="top"><strong>زاد المعرفة</strong><a href="library.html">← المكتبة</a></header><main class="wrap"><article class="book"><div id="icon" class="cover">📘</div><div><span class="tag">صفحة الكتاب</span><h1 id="title">الكتاب</h1><div class="meta"><span id="cat" class="tag"></span><span id="grade" class="tag"></span><span class="tag" id="downloads">📥 التحميلات: تُسجل عند الفتح</span></div><p id="desc">يمكنك معاينة الكتاب أو فتحه وتحميله.</p><div class="actions"><a id="preview" class="btn alt" target="_blank" rel="noopener">👁️ معاينة</a><a id="download" class="btn book-open" target="_blank" rel="noopener">⬇️ تحميل / فتح</a></div></div></article></main><script type="module">import {hasSignedInUser,trackBookDownload} from './book-download-tracker.js';const p=new URLSearchParams(location.search);const b={title:p.get('title')||'كتاب',url:p.get('url')||'',cat:p.get('cat')||'',grade:p.get('grade')||'',desc:p.get('desc')||'يمكنك معاينة الكتاب أو تحميله.',icon:p.get('icon')||'📘'};title.textContent=b.title;document.title=b.title+' — زاد المعرفة';icon.textContent=b.icon;cat.textContent=b.cat;grade.textContent=b.grade;desc.textContent=b.desc;preview.href=b.url;download.href=b.url;download.addEventListener('click',async e=>{if(!hasSignedInUser()){e.preventDefault();alert('يجب تسجيل الدخول أولاً حتى يتم تسجيل التحميل باسمك.');location.href='../login/index.html';return}trackBookDownload({title:b.title,url:b.url,grade:b.grade,category:b.cat}).catch(()=>{})});</script></body></html>
